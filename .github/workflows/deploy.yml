name: Deploy Atlas to GitHub Pages

# Manual trigger only — pushes to main do NOT auto-deploy.
# Run via: Actions tab → "Deploy Atlas to GitHub Pages" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to deploy'
        required: false
        default: 'main'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          # Set SITE_BASE repo variable to "" if you've configured a custom
          # domain (CNAME). Otherwise leave as /atlas to match the repo name
          # at <user>.github.io/atlas/.
          BASE: ${{ vars.SITE_BASE || '/atlas' }}
          SITE: ${{ vars.SITE_URL || 'https://sitharaj88.github.io' }}
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
